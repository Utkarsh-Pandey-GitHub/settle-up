services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: settleup
      POSTGRES_PASSWORD: settleup_local
      POSTGRES_DB: settleup
    ports: ["5432:5432"]
    volumes: ["settleup_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settleup -d settleup"]
      interval: 5s
      retries: 10
volumes:
  settleup_pg:
