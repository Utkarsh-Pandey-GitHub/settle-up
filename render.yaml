services:
  - type: web
    name: settleup-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx prisma migrate deploy && npx tsx apps/api/src/server.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: OTP_PROVIDER
        value: stytch
      - key: STYTCH_PROJECT_ID
        value: project-live-11cee23f-4763-43a7-9e11-0a8a1e488b0d
      - key: STYTCH_SECRET
        value: secret-live-SgYSSXa711TTSLA4G59_82Ce0Wq27cObA68=
      - key: TRUECALLER_CLIENT_ID
        value: reu4dkuzbwcc9bcwz2yjepj1cewqd4tpf7_xl11cd1s
