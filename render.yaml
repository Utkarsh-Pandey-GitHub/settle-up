services:
  - type: web
    name: settleup-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx prisma migrate deploy && npx tsx apps/api/src/server.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: TRUECALLER_CLIENT_ID
        value: f6ydr8pehvg_69vacnh7z4alfzdzpywyremiruuuegg
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BILL_VISION_MODEL
        value: openrouter/free
